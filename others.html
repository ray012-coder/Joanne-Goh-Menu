<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店 - 零食周边</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-others">
    <div class="header">
        <h1>吴琪惠的小仓库 · Others</h1>
        <p>除了奶茶，还有这些续命小零食 🍿</p>
    </div>
    <div class="main">
    <div class="sidebar">
        <a href="index.html">Mixue</a>
        <a href="chagee.html">Chagee</a>
        <a href="bingxue.html">Bingxue</a>
        <a href="others.html">Others</a>
        <a href="account.html">Mine</a>
    </div>
        <div class="content">
            <div class="section-title">精选零食</div>
            
            <!-- 商品 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/85?text=Chips" class="product-img">
                <div class="product-info">
                    <div>
                        <h4 class="product-name">乐事原味薯片</h4>
                        <span class="product-tag">追剧必备</span>
                    </div>
                    <div class="product-price-row">
                        <span class="price">￥7</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>

            <!-- 商品 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/85?text=Cookie" class="product-img">
                <div class="product-info">
                    <div>
                        <h4 class="product-name">奥利奥夹心饼干</h4>
                        <span class="product-tag">扭一扭</span>
                    </div>
                    <div class="product-price-row">
                        <span class="price">￥6</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>

            <div class="section-title">限量周边</div>
            
            <!-- 商品 3 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/85?text=Cup" class="product-img">
                <div class="product-info">
                    <div>
                        <h4 class="product-name">雪王吨吨桶</h4>
                        <span class="product-tag">限量版</span>
                    </div>
                    <div class="product-price-row">
                        <span class="price">￥15</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <div class="cart-bar">
        <div>总计 <span class="total-amount">￥0</span></div>
        <div class="checkout-btn">去结算</div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
