<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店 - 蜜雪冰城</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-mixue">
    <div class="header">
        <h1>吴琪惠专属商店 · Mixue</h1>
        <p>你爱我 我爱你 蜜雪冰城甜蜜蜜 🍦</p>
    </div>
    <div class="main">
    <div class="sidebar">
        <a href="index.html">Mixue</a>
        <a href="chagee.html">Chagee</a>
        <a href="bingxue.html">Bingxue</a>
        <a href="others.html">Others</a>
        <a href="account.html">Mine</a>
    </div>
        <div class="content">
            <div class="section-title">今日爆款</div>
            <div class="product-card">
                <img src="mixue pic/fresh lemonade mixue.jpg" class="product-img">
                <div class="product-info">
                    <h4 class="product-name">Fresh Lemonade</h4>
                    <div class="product-price-row">
                        <span class="price">MYR 4</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <img src="mixue pic/Taro Grape Tea Mixue.jpg" class="product-img">
                <div class="product-info">
                    <h4 class="product-name">Taro Grape Tea</h4>
                    <div class="product-price-row">
                        <span class="price">MYR 7</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <img src="mixue pic/peach jasmine tea mixue.jpg" class="product-img">
                <div class="product-info">
                    <h4 class="product-name">Peach Jasmine Tea</h4>
                    <div class="product-price-row">
                        <span class="price">MYR 7</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="section-title">Fresh Ice Cream</div>
                <div class="product-card">
                    <img src="mixue pic/peach sundae.jpg" class="product-img">
                    <div class="product-info">
                        <h4 class="product-name">Peach Sundae</h4>
                        <div class="product-price-row">
                            <span class="price">MYR 6</span>
                            <button class="add-btn">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="section-title">Milk Tea</div>
                <div class="product-card">
                    <img src="mixue pic/strawberry creamy drink.jpg" class="product-img">
                    <div class="product-info">
                        <h4 class="product-name">Strawberry Creamy Drink</h4>
                        <div class="product-price-row">
                            <span class="price">MYR 5.50</span>
                            <button class="add-btn">+</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="product-card">
                <img src="mixue pic/Brown Sugar Milk Tea Mixue.jpg" class="product-img">
                <div class="product-info">
                    <h4 class="product-name">Brown Sugar Bubble Tea</h4>
                    <div class="product-price-row">
                        <span class="price">MYR 6.50</span>
                        <button class="add-btn">+</button>
                    </div>
                </div>
            </div>
            
        </div>
    <div class="cart-bar">
        <div>总计 <span class="total-amount">￥0</span></div>
        <div class="checkout-btn">去结算</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
