<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商店 - 我的中心</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-account">
    <div class="header">
        <h1>个人中心 · Account</h1>
        <p>吴琪惠专属超级会员 👑</p>
    </div>
    
    <div class="main">
        <div class="sidebar">
            <a href="index.html">Mixue</a>
            <a href="chagee.html">Chagee</a>
            <a href="bingxue.html">Bingxue</a>
            <a href="others.html">Others</a>
            <a href="account.html" class="active">Mine</a>
        </div>
        
        <div class="content">
            <!-- 个人信息卡片 -->
            <div class="user-info">
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="avatar" style="display:flex; align-items:center; justify-content:center; font-size:2rem;">👸</div>
                    <h3 style="margin:5px 0;">吴琪惠</h3>
                    <p style="font-size:0.75rem; color:#888;">ID: 20260513888</p>
                </div>
            </div>

            <!-- 数据展示 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-num">999</div>
                    <div class="stat-label">账户积分</div>
                </div>
                <div class="stat-card">
                    <div class="stat-num">无限次</div>
                    <div class="stat-label">免单券</div>
                </div>
            </div>

            <div class="section-title" style="margin-top:25px;">常用功能</div>
            
            <div class="product-card" style="align-items:center; cursor:pointer;">
                <span style="font-size:1.2rem; margin-right:10px;">📋</span>
                <h4 style="margin:0; flex:1;">我的订单</h4>
                <span style="color:#ccc;">></span>
            </div>

            <div class="product-card" style="align-items:center; cursor:pointer;">
                <span style="font-size:1.2rem; margin-right:10px;">🎁</span>
                <h4 style="margin:0; flex:1;">优惠券中心</h4>
                <span style="color:#ccc;">></span>
            </div>

            <div class="product-card" style="align-items:center; cursor:pointer;">
                <span style="font-size:1.2rem; margin-right:10px;">📞</span>
                <h4 style="margin:0; flex:1;">联系湯鈜驛</h4>
                <span style="color:#ccc;">></span>
            </div>

        </div>
    </div>

    <!-- 底部保留一个装饰性的退出登录 -->
    <div class="cart-bar" style="background:#eee; box-shadow:none;">
        <div style="color:#666; font-size:0.9rem; margin-left:10px;">当前版本 v2.0</div>
        <div class="checkout-btn" style="background:#333; font-size:0.8rem; height:35px;">注销登录</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
